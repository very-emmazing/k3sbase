# SOPS-encrypted secret – encrypt before committing to a real cluster:
#   1. Create the tunnel locally: cloudflared tunnel create pi
#      (writes ~/.cloudflared/<TUNNEL_ID>.json)
#   2. Paste the full JSON file content as the credentials.json value below
#   3. Run: sops -e -i clusters/pi/infrastructure/cloudflared-credentials-secret.yaml
#   4. Commit the encrypted file (the age recipient in .sops.yaml must be set first)
apiVersion: v1
kind: Secret
metadata:
  name: cloudflared-credentials
  namespace: cloudflared
stringData:
  credentials.json: ""
