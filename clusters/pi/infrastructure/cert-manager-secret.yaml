# SOPS-encrypted secret – "mise run setup -- pi" fills and encrypts this
# together with the external-dns secret (same Cloudflare token, but
# cert-manager resolves ClusterIssuer secretRefs only from its own
# namespace, so the token must exist there too).
# Manual alternative:
#   1. Set the actual token value below
#   2. Run: sops -e -i clusters/pi/infrastructure/cert-manager-secret.yaml
#   3. Commit the encrypted file
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
stringData:
  token: ""
