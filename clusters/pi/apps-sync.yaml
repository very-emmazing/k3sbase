# Workloads (Beispiel- und spätere echte Apps), getrennt von infrastructure:
# hier liegen CRs (ClusterIssuer, Gateway, HTTPRoute), deren CRDs erst durch
# die infrastructure-HelmReleases (cert-manager) bzw. Cilium entstehen.
# dependsOn + healthChecks in infrastructure-sync.yaml stellen sicher, dass
# die CRDs existieren, bevor hier appliziert wird.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/pi/apps
  prune: true
  dependsOn:
    - name: infrastructure
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-versions
      - kind: ConfigMap
        name: cluster-settings
