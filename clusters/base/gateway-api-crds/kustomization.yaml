# Gateway API CRDs, Standard-Channel, gepinnt auf v1.1.0 (von Cilium 1.16
# vorausgesetzte Version). Vendored aus
# https://github.com/kubernetes-sigs/gateway-api/tree/v1.1.0/config/crd/standard
# damit flux-local ohne externe Source rendern kann.
# Version nur zusammen mit CILIUM_VERSION anheben (Kompatibilitätsmatrix in
# der Cilium-Doku beachten; neuere Gateway-API-Releases brechen ältere Cilium-
# Versionen, siehe cilium/cilium#45139).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gateway.networking.k8s.io_gatewayclasses.yaml
- gateway.networking.k8s.io_gateways.yaml
- gateway.networking.k8s.io_grpcroutes.yaml
- gateway.networking.k8s.io_httproutes.yaml
- gateway.networking.k8s.io_referencegrants.yaml
